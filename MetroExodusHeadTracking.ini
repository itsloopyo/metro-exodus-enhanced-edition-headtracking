;  Metro Exodus Enhanced Edition - Head Tracking configuration
;  Lives next to MetroExodus.exe. Edit while the game is closed.

[General]
EnableOnStartup=1
;  UDP port to listen on, 1024 to 65535. A value outside that range stops the
;  mod loading rather than being ignored.
Port=4242
;  Which up-axis head yaw turns about.
;    true  - the world up-axis. Look at the floor and turn your head and
;            you still pan across it, level with the horizon.
;    false - the camera's own up-axis, which leans the view once the
;            camera is pitched steeply.
;  Page Down switches between the two while you play; this key is only
;  what the mod starts on.
WorldSpaceYaw=1

[Sensitivity]
Yaw=1
Pitch=1
Roll=1
InvertYaw=0
InvertPitch=0
InvertRoll=0

[Smoothing]
;  Smoothing applied when the tracker runs on this machine (loopback).
;  0 = no smoothing, 1 = heavy.
LocalSmoothing=0
;  Smoothing applied when the tracker is a remote device on the network.
;  0 = no smoothing, 1 = heavy.
RemoteSmoothing=0.15

[Position]
;  Positional (6DOF) head tracking: leaning and moving your head.
Enabled=1
SensitivityX=1
SensitivityY=1
SensitivityZ=1
;  Travel limits in metres.
LimitX=0.3
LimitY=0.2
LimitYDown=0.2
LimitZ=0.4
LimitZBack=0.1

[Hotkeys]
;  Virtual-key codes. Defaults: End (toggle tracking),
;  Page Up (cycle mode: rotation and position, rotation only,
;  position only).
Toggle=0x23
CycleMode=0x21
;  Page Down switches yaw between the world up-axis and the camera's own.
YawMode=0x22
;  Insert cycles what head tracking does while the sights are up.
AdsMode=0x2D
;  Chord alternatives: Ctrl+Shift+Y (toggle tracking),
;  Ctrl+Shift+G (cycle mode), Ctrl+Shift+H (yaw mode),
;  Ctrl+Shift+U (cycle ADS mode).
ChordToggle=1
ChordCycleMode=1
ChordYawMode=1
ChordAdsMode=1

[View]
;  What head tracking does while you are aiming down sights.
;    paused  - the game keeps the camera until you lower the weapon.
;    marker  - tracking carries on, and a marker is drawn where
;              your rounds will land.
;    tracked - tracking carries on, nothing drawn.
;  Insert cycles the same three in that order and saves the choice
;  back here. Anything else in this key reads as paused.
AdsMode=paused

[Camera]
;  Field of view in degrees, the same number the game's own Field of View
;  slider sets. 0 leaves that slider alone. The game stops its slider at 75,
;  and its engine holds the drawn picture at 60 in a level whatever the
;  slider says; a value here goes past both, up to 120. The picture, the HUD
;  scale and what the game bothers to draw all follow it, because it is the
;  game's own setting rather than a change made behind the engine's back.
;  Setting it also takes the engine's hold off, which is six bytes written
;  into the running game's code, and it widens the bounds the game's own
;  setter enforces. The setting and its bounds are put back when the game
;  exits; the six bytes live only in memory and go with the process. Nothing
;  is written when this is 0, and the main menu draws at 60 either way.
;  Accepted: 0, or 60 to 120. Anything else stops the mod loading.
FieldOfView=0
;  Per-frame camera logging: the pose the tracker sent, the camera the
;  game published, and the camera the engine built the frame from. It is
;  how a game patch that moved the camera gets re-derived, and how a
;  report of the view going the wrong way gets answered. It writes
;  megabytes an hour to the log; leave it off unless we ask you to turn
;  it on.
Discovery=0

[Light]
;  Whether your torch turns with your head instead of staying on your aim.
LightFollowsHead=1
;  How far the beam leads your view. It is deliberately more than 1: when
;  you turn your head you keep looking at what you turned towards, so your
;  gaze sits past the middle of the screen, and a beam matched to the view
;  alone lands short of it. Accepted: 0 to 5. 0 pins the beam to your aim,
;  which is what the game does unmodded. Anything outside that range is
;  refused and the beam stays on the aim.
LightMultiplier=1.5
